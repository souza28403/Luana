<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aceita sair comigo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, playful, a love note
   IDEA: a little greeting card that opens into a date planner
   PICTURE: hand-drawn cats (one with a bouquet, one overjoyed)
   COLOUR and TYPE: rose ground, berry ink, warm sun accent; Fredoka + Nunito
   LAYOUT: one centered card column, phone first */
:root{color-scheme:light dark;
  --bg:light-dark(#ffe1e8,#2a1220);
  --card:light-dark(#fff8f9,#3b1a2d);
  --ink:light-dark(#4a1030,#ffe6ee);
  --soft:light-dark(#8a4a66,#e7b3c6);
  --berry:#d6245f;--berry-d:#a8114a;
  --sun:#ffb938;
  --line:light-dark(#f4c3d1,#5a2a44);
  --fur:#f6a54a;--fur-d:#d9822a;--fur-l:#ffd29a;
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;
  background-image:radial-gradient(circle at 15% 10%,rgba(255,255,255,.45) 0 60px,transparent 61px),radial-gradient(circle at 90% 85%,rgba(255,255,255,.35) 0 90px,transparent 91px)}
.screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));text-align:center}
.hidden{display:none!important}
h1{font:700 clamp(32px,9vw,46px)/1.05 Fredoka,sans-serif;margin:8px 0 6px;text-wrap:balance;color:var(--ink)}
h2{font:600 clamp(24px,6.5vw,32px)/1.1 Fredoka,sans-serif;margin:4px 0 4px;text-wrap:balance}
.sub{color:var(--soft);margin:0 0 22px;font-size:16px}
.cat{width:min(72vw,280px);height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(160,20,70,.18))}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:80px}
button{font:600 18px Fredoka,sans-serif;border:0;border-radius:999px;cursor:pointer;min-height:52px;padding:0 30px;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#yes{background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry-d);transition:transform .25s}
#yes:active{translate:0 3px;box-shadow:0 3px 0 var(--berry-d)}
#no{background:var(--card);color:var(--soft);border:2px solid var(--line);transition:left .18s ease,top .18s ease}
#no.run{position:fixed;z-index:20}
.card{width:min(100%,420px);background:var(--card);border-radius:28px;padding:18px 16px 20px;box-shadow:0 14px 40px rgba(160,20,70,.14)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font:600 20px Fredoka,sans-serif;text-transform:capitalize}
.nav{width:44px;height:44px;padding:0;background:transparent;color:var(--berry);font-size:24px;border-radius:50%}
.nav:disabled{opacity:.25}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:13px;font-weight:700;color:var(--soft);padding:4px 0}
.day{aspect-ratio:1;min-height:40px;padding:0;border-radius:50%;background:transparent;color:var(--ink);font:600 16px Nunito,sans-serif}
.day:disabled{color:var(--soft);opacity:.35}
.day.today{box-shadow:inset 0 0 0 2px var(--line)}
.day.sel{background:var(--berry);color:#fff;box-shadow:none;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.lbl{font:600 16px Fredoka,sans-serif;margin:18px 0 8px;text-align:left}
.times{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;font:700 15px Nunito,sans-serif;background:transparent;color:var(--ink);border:2px solid var(--line)}
.chip.sel{background:var(--sun);border-color:var(--sun);color:#4a1030}
#confirm{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:20px;border-radius:999px;text-decoration:none;
  font:600 18px Fredoka,sans-serif;background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry-d)}
#confirm.off{opacity:.4;box-shadow:none;pointer-events:none}
.big{font:700 clamp(26px,7vw,34px)/1.15 Fredoka,sans-serif;color:var(--berry);margin:6px 0 2px;text-wrap:balance}
.gcal{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;min-height:54px;padding:0 26px;border-radius:999px;
  background:#fff;color:#3c4043;font:600 17px Fredoka,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.12);border:1px solid #e3e3e3}
.gcal svg{width:24px;height:24px}
.note{font-size:14px;color:var(--soft);margin-top:14px;max-width:320px}
.link{background:none;color:var(--soft);font:600 15px Nunito,sans-serif;text-decoration:underline;min-height:44px;margin-top:6px}
.heart{position:fixed;pointer-events:none;font-size:22px;z-index:30;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-70vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.bob,.day.sel,.heart{animation:none}#no{transition:none}}
</style>
</head>
<body>

<!-- SVG parts reused by both cats -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#ffc77a"/><stop offset="1" stop-color="#f29a3e"/></radialGradient>
    <radialGradient id="blush" r=".5"><stop offset="0" stop-color="#ff7a9c" stop-opacity=".75"/><stop offset="1" stop-color="#ff7a9c" stop-opacity="0"/></radialGradient>
    <g id="rose">
      <circle r="13" fill="#e8336d"/><circle r="9" fill="#ff5a8a"/>
      <path d="M-5 -2 q5 -6 10 0 q-5 5 -10 0z" fill="#c21a54"/><circle r="3" fill="#a8114a"/>
    </g>
    <g id="tulip">
      <path d="M-11 4 q0 -18 11 -18 q11 0 11 18 q-11 8 -22 0z" fill="#ffb938"/>
      <path d="M-4 -12 q4 8 4 18 M0 6 q4 -10 4 -18" stroke="#e8951a" stroke-width="2" fill="none"/>
    </g>
  </defs>
</svg>

<!-- TELA 1 -->
<section class="screen" id="s1">
  <svg class="cat bob" viewBox="0 0 300 300" role="img" aria-label="Gatinho segurando um buquê de flores">
    <ellipse cx="150" cy="284" rx="92" ry="10" fill="#c21a54" opacity=".12"/>
    <!-- tail -->
    <path d="M215 250 q60 -10 50 -70 q-6 -28 -24 -22" stroke="#f29a3e" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="150" cy="225" rx="72" ry="60" fill="url(#fur)"/>
    <ellipse cx="150" cy="240" rx="40" ry="38" fill="#fff1dd"/>
    <!-- feet -->
    <ellipse cx="118" cy="280" rx="20" ry="10" fill="#ffd29a"/><ellipse cx="182" cy="280" rx="20" ry="10" fill="#ffd29a"/>
    <!-- head -->
    <path d="M86 70 l12 -48 l38 30z" fill="#f29a3e"/><path d="M214 70 l-12 -48 l-38 30z" fill="#f29a3e"/>
    <path d="M98 60 l6 -26 l18 16z" fill="#ffb3c4"/><path d="M202 60 l-6 -26 l-18 16z" fill="#ffb3c4"/>
    <ellipse cx="150" cy="100" rx="78" ry="64" fill="url(#fur)"/>
    <path d="M150 38 v16 M136 42 l4 12 M164 42 l-4 12" stroke="#d9822a" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes (shiny) -->
    <ellipse cx="120" cy="100" rx="12" ry="15" fill="#3a1424"/><ellipse cx="180" cy="100" rx="12" ry="15" fill="#3a1424"/>
    <circle cx="124" cy="94" r="5" fill="#fff"/><circle cx="184" cy="94" r="5" fill="#fff"/>
    <circle cx="116" cy="106" r="2.5" fill="#fff"/><circle cx="176" cy="106" r="2.5" fill="#fff"/>
    <ellipse cx="100" cy="124" rx="16" ry="10" fill="url(#blush)"/><ellipse cx="200" cy="124" rx="16" ry="10" fill="url(#blush)"/>
    <path d="M145 118 h10 l-5 6z" fill="#e8336d"/>
    <path d="M150 124 q-6 9 -14 4 M150 124 q6 9 14 4" stroke="#3a1424" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M78 112 h-30 M80 122 l-28 6 M222 112 h30 M220 122 l28 6" stroke="#d9822a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- bouquet -->
    <path d="M150 262 l-16 -64 M150 262 l0 -70 M150 262 l16 -64 M150 262 l-30 -52 M150 262 l30 -52" stroke="#3f9a52" stroke-width="4"/>
    <path d="M150 262 q-28 -40 -14 -46 q6 22 14 46z" fill="#5bbb6c"/><path d="M150 262 q28 -40 14 -46 q-6 22 -14 46z" fill="#5bbb6c"/>
    <use href="#rose" x="134" y="196"/><use href="#rose" x="166" y="196"/><use href="#tulip" x="150" y="182"/>
    <use href="#tulip" x="118" y="210"/><use href="#rose" x="150" y="210"/><use href="#tulip" x="182" y="210"/>
    <path d="M128 248 l44 0 l-10 26 l-24 0z" fill="#fff" stroke="#f4c3d1" stroke-width="2"/>
    <path d="M150 250 q-14 -12 -18 2 q4 10 18 0 q14 10 18 0 q-4 -14 -18 -2z" fill="#d6245f"/>
    <!-- paws holding -->
    <ellipse cx="128" cy="252" rx="13" ry="11" fill="#ffd29a"/><ellipse cx="172" cy="252" rx="13" ry="11" fill="#ffd29a"/>
  </svg>
  <h1 id="ask">Aceita sair comigo?</h1>
  <p class="sub" id="hint">Escolha com carinho 💌</p>
  <div class="btns">
    <button id="yes" type="button">Sim</button>
    <button id="no" type="button">Não</button>
  </div>
</section>

<!-- TELA 2 -->
<section class="screen hidden" id="s2">
  <svg class="cat bob" style="width:min(48vw,190px)" viewBox="0 0 300 260" role="img" aria-label="Gatinho muito feliz">
    <ellipse cx="150" cy="250" rx="80" ry="8" fill="#c21a54" opacity=".12"/>
    <ellipse cx="150" cy="205" rx="66" ry="46" fill="url(#fur)"/>
    <ellipse cx="150" cy="215" rx="36" ry="30" fill="#fff1dd"/>
    <!-- arms up -->
    <path d="M96 190 q-30 -30 -26 -70" stroke="#f29a3e" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M204 190 q30 -30 26 -70" stroke="#f29a3e" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="116" r="13" fill="#ffd29a"/><circle cx="230" cy="116" r="13" fill="#ffd29a"/>
    <path d="M86 74 l12 -48 l38 30z" fill="#f29a3e"/><path d="M214 74 l-12 -48 l-38 30z" fill="#f29a3e"/>
    <path d="M98 64 l6 -26 l18 16z" fill="#ffb3c4"/><path d="M202 64 l-6 -26 l-18 16z" fill="#ffb3c4"/>
    <ellipse cx="150" cy="104" rx="76" ry="62" fill="url(#fur)"/>
    <!-- happy closed eyes -->
    <path d="M106 102 q14 -16 28 0 M166 102 q14 -16 28 0" stroke="#3a1424" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="102" cy="124" rx="16" ry="10" fill="url(#blush)"/><ellipse cx="198" cy="124" rx="16" ry="10" fill="url(#blush)"/>
    <path d="M145 116 h10 l-5 6z" fill="#e8336d"/>
    <path d="M128 128 q22 30 44 0z" fill="#7a1a3a"/><path d="M138 136 q12 10 24 0 q-12 -6 -24 0z" fill="#ff7a9c"/>
    <path d="M78 114 h-30 M222 114 h30" stroke="#d9822a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- sparkles -->
    <g fill="#ffb938"><path d="M40 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M262 50 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/></g>
    <path d="M250 150 c-6 -10 -20 -4 -14 6 l14 14 l14 -14 c6 -10 -8 -16 -14 -6z" fill="#e8336d"/>
  </svg>
  <h2>Eba! Agora escolhe o dia 🥰</h2>
  <p class="sub" style="margin-bottom:14px">Toque no dia e no horário que preferir</p>

  <div class="card">
    <div class="cal-head">
      <button class="nav" id="prev" type="button" aria-label="Mês anterior">‹</button>
      <b id="month"></b>
      <button class="nav" id="next" type="button" aria-label="Próximo mês">›</button>
    </div>
    <div class="grid" id="wd"></div>
    <div class="grid" id="days"></div>
    <p class="lbl">Que horas?</p>
    <div class="times" id="times"></div>
    <a id="confirm" class="cta off" href="#" target="_blank" rel="noopener" aria-disabled="true">Escolhe um dia ✨</a>
  </div>
</section>

<!-- TELA 3 -->
<section class="screen hidden" id="s3">
  <svg class="cat" style="width:min(40vw,150px)" viewBox="0 0 120 110" aria-hidden="true">
    <path d="M60 104 C20 76 4 52 14 30 C24 8 50 12 60 32 C70 12 96 8 106 30 C116 52 100 76 60 104z" fill="#e8336d"/>
    <path d="M30 30 q8 -10 18 -4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
  </svg>
  <h2>Combinado! 💘</h2>
  <p class="big" id="chosen"></p>
  <p class="sub" style="margin:0">Mal posso esperar</p>
  <p class="note">Já anotei aqui. Te vejo lá! 😽</p>
  <button class="link" id="back" type="button">Trocar a data</button>
</section>

<script>
{
  /* ===== CONFIGURE AQUI ===== */
  const SCRIPT_URL = "";             // URL do Apps Script (termina em /exec) — cria o evento na SUA agenda
  const HORARIOS = ["12:00","15:00","18:00","19:00","20:00","21:00"];
  /* ========================== */

  const $ = id => document.getElementById(id);
  const show = id => { for (const s of ["s1","s2","s3"]) $(s).classList.toggle("hidden", s !== id); scrollTo(0,0); };

  /* --- Tela 1: o botão Não foge --- */
  const no = $("no"), yes = $("yes");
  const frases = ["Não","Tem certeza?","Pensa bem...","Vai, aceita 🥺","Não adianta 😹","Clica no Sim!","Erro 404: Não","Quase... 😝"];
  let tries = 0;
  function flee(e){
    if (e) { e.preventDefault(); e.stopPropagation(); }
    tries++;
    no.textContent = frases[tries % frases.length];
    if (!no.classList.contains("run")) {
      const r = no.getBoundingClientRect();
      no.classList.add("run"); no.style.left = r.left + "px"; no.style.top = r.top + "px";
      void no.offsetWidth;
    }
    const pad = 16, w = no.offsetWidth, h = no.offsetHeight;
    const yr = yes.getBoundingClientRect();
    let x, y, n = 0;
    do {
      x = pad + Math.random() * (innerWidth - w - pad*2);
      y = pad + Math.random() * (innerHeight - h - pad*2);
      n++;
    } while (n < 30 && x < yr.right + 12 && x + w > yr.left - 12 && y < yr.bottom + 12 && y + h > yr.top - 12);
    no.style.left = x + "px"; no.style.top = y + "px";
    yes.style.transform = `scale(${Math.min(1 + tries * 0.08, 1.7)})`;
  }
  for (const ev of ["touchstart","pointerdown","mouseenter","click","focus"]) no.addEventListener(ev, flee, {passive:false});
  no.addEventListener("keydown", e => { e.preventDefault(); flee(); });

  function hearts(){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 18; i++) {
      const h = document.createElement("span");
      h.className = "heart"; h.textContent = ["💖","💕","💗","🌸"][i % 4];
      h.style.left = (10 + Math.random() * 80) + "vw"; h.style.top = (70 + Math.random() * 25) + "vh";
      h.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      h.style.setProperty("--r", (Math.random() * 90 - 45) + "deg");
      h.style.animationDelay = (Math.random() * .5) + "s";
      document.body.appendChild(h); setTimeout(() => h.remove(), 2400);
    }
  }
  yes.addEventListener("click", () => { hearts(); no.classList.add("hidden"); setTimeout(() => show("s2"), 500); });

  /* --- Tela 2: calendário --- */
  const today = new Date(); today.setHours(0,0,0,0);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  let selDate = null, selTime = null;
  const fmtMonth = new Intl.DateTimeFormat("pt-BR", {month:"long", year:"numeric"});
  $("wd").innerHTML = ["D","S","T","Q","Q","S","S"].map(d => `<div class="wd">${d}</div>`).join("");

  function render(){
    $("month").textContent = fmtMonth.format(view);
    $("prev").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
    const first = view.getDay(), total = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    let html = "<div></div>".repeat(first);
    for (let d = 1; d <= total; d++) {
      const dt = new Date(view.getFullYear(), view.getMonth(), d);
      const cls = ["day"];
      if (+dt === +today) cls.push("today");
      if (selDate && +dt === +selDate) cls.push("sel");
      html += `<button type="button" class="${cls.join(" ")}" data-d="${d}" ${dt < today ? "disabled" : ""}>${d}</button>`;
    }
    $("days").innerHTML = html;
    updateConfirm();
  }
  $("days").addEventListener("click", e => {
    const b = e.target.closest(".day"); if (!b || b.disabled) return;
    selDate = new Date(view.getFullYear(), view.getMonth(), +b.dataset.d); render();
  });
  $("prev").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); });
  $("next").addEventListener("click", () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); });

  $("times").innerHTML = HORARIOS.map(t => `<button type="button" class="chip" data-t="${t}">${t.replace(":00","h")}</button>`).join("");
  $("times").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    selTime = b.dataset.t;
    for (const c of $("times").children) c.classList.toggle("sel", c === b);
    updateConfirm();
  });

  /* --- Envio para a agenda dele (via Apps Script) --- */
  const pad = n => String(n).padStart(2, "0");
  let label = "";
  function updateConfirm(){
    const c = $("confirm"), ok = !!(selDate && selTime);
    c.classList.toggle("off", !ok); c.setAttribute("aria-disabled", String(!ok));
    c.textContent = !selDate ? "Escolhe um dia ✨" : !selTime ? "Agora o horário ⏰" : "Confirmar 💖";
    if (!ok) { c.href = "#"; return; }
    const d = selDate;
    const inicio = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${selTime}:00-03:00`;
    const dia = new Intl.DateTimeFormat("pt-BR", {weekday:"long", day:"numeric", month:"long"}).format(d);
    label = `${dia.charAt(0).toUpperCase() + dia.slice(1)}, às ${selTime.replace(":00","h")}`;
    c.href = SCRIPT_URL ? `${SCRIPT_URL}?${new URLSearchParams({inicio, txt: label})}` : "#";
  }
  $("confirm").addEventListener("click", e => {
    if (!(selDate && selTime)) { e.preventDefault(); return; }
    if (!SCRIPT_URL) e.preventDefault();
    $("chosen").textContent = label;
    hearts(); show("s3");
  });
  $("back").addEventListener("click", () => show("s2"));

  render();
}
</script>
</body>
</html>
